<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Home Dashboard Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="/css/login.css" /> <!-- Reutiliza el mismo CSS -->
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="video-circular">
                <video src="/video/video1.mp4" autoplay muted loop></video>
            </div>
            <h2><i class=""></i> Crear Cuenta</h2>
            <form>
                <label for="fullname"><i class="fas fa-user"></i> Nombre completo</label>
                <input type="text" id="fullname" name="fullname" required />
                <label for="username"><i class="fas fa-user-circle"></i> Usuario</label>
                <input type="text" id="username" name="username" required />
                <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
                <input type="password" id="password" name="password" required />
                <label for="confirm-password"><i class="fas fa-lock"></i> Confirmar contraseña</label>
                <input type="password" id="confirm-password" name="confirm-password" required />
                <button type="submit"><i class=""></i> Registrarse</button>
            </form>
            <p style="margin-top: 1rem; font-size: 0.95rem;">
                ¿Ya tienes cuenta?
                <a href="/templates/login.html" style="color: var(--primary-color); text-decoration: none; font-weight: bold;">
                    <i class=""></i> Inicia sesión
                </a>
            </p>
        </div>
    </div>
</body>
</html>
